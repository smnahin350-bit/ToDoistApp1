<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDoistApp1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>MY TASK</h1>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="Write task" required />
      <label class="field-label" for="task-time">Time</label>
      <input id="task-time" type="time" aria-label="Task time" />
      <label class="field-label" for="task-priority">Priority</label>
      <select id="task-priority" aria-label="Task priority">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="high">High priority</option>
      </select>
      <button type="submit">Add Task</button>
    </form>

    <ul id="task-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
